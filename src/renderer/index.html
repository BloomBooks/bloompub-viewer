<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Renderer has no node integration (BL-8994); keep scripts to 'self'.
         electron.vite.config.ts relaxes script-src-elem for the dev server only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src https: 'self'; style-src 'self' 'unsafe-inline' https: ; script-src-elem 'self'; object-src 'none'; img-src 'self' data:"
    />
    <style>
      @font-face {
        font-family: "Andika";
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        src: url("static/fonts/Andika-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Andika";
        font-weight: bold;
        font-style: normal;
        font-display: swap;
        src: url("static/fonts/Andika-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Andika";
        font-weight: normal;
        font-style: italic;
        font-display: swap;
        src: url("static/fonts/Andika-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Andika";
        font-weight: bold;
        font-style: italic;
        font-display: swap;
        src: url("static/fonts/Andika-BoldItalic.woff2") format("woff2");
      }
      @font-face {
        font-family: "ABeeZee";
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        src: url("static/fonts/ABeeZee-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "ABeeZee";
        font-weight: normal;
        font-style: italic;
        font-display: swap;
        src: url("static/fonts/ABeeZee-Italic.woff2") format("woff2");
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
