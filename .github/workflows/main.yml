name: Build/release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+ (Node + pnpm)
        # Reads the Node version from .node-version and the pnpm version from
        # the package.json "packageManager" field. Replaces Volta + pnpm/action-setup.
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build Electron app
        env:
          in_github_action: "true"
        run: vp run build:ci

      # The Andika and ABeeZee fonts we ship live in static/, and only reach the package
      # because webpack.renderer.config.js copies static/ into dist/electron/ in production
      # builds.  Nothing else fails if that copy stops happening, and the app would still
      # look fine to anyone online or with Andika and ABeeZee installed, so assert it here.
      # (BL-16708)
      - name: Verify the Andika fonts were packaged
        shell: bash
        run: |
          for face in Regular Bold Italic BoldItalic; do
            file="dist/electron/static/fonts/Andika-$face.woff2"
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "All four Andika faces are present."
      - name: Verify the ABeeZee fonts were packaged
        shell: bash
        run: |
          for face in Regular Italic; do
            file="dist/electron/static/fonts/ABeeZee-$face.woff2"
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "Both ABeeZee faces are present."

      # The two checks above only prove webpack staged the fonts; electron-builder
      # could still leave them out of what actually ships. This one looks inside the
      # packed app's own file table. (Raised by Devin on PR #63.)
      - name: Verify the fonts reached the packaged app
        shell: bash
        run: node .github/scripts/verify-packaged-fonts.js "$(ls output/*-unpacked/resources/app.asar)"

      - name: Sign installer
        if: github.event_name != 'pull_request'
        uses: sillsdev/codesign/trusted-signing-action@0485c27c94116d62f80febc468cc1979ed7245de # v3.2.0
        with:
          credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
          files-folder: output
          files-folder-filter: BloomPUB*.exe
          description: "BloomPUB Viewer Installer"
          description-url: "https://bloomlibrary.org/bloompub-viewer"

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # The signer changes the installer's name from BloomPUB-Viewer-Setup-<x.y.z>.exe to
        # BloomPub.Viewer Setup <x.y.z>.exe.  (Uploading changes spaces to periods.)  The
        # latter is what we want to release. (BL-15534)
        with:
          files: |
            output/BloomPUB *.exe
            output/BloomPUB.*.exe
          name: ${{ github.ref_name }}
          body: |
            Release for version ${{ github.ref_name }}
          draft: true

  build-linux:
    runs-on: ubuntu-latest
    # Run after the Windows job so both upload into the same draft release
    # rather than racing to create two separate drafts for the same tag.
    needs: build-windows

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+ (Node + pnpm)
        # Reads the Node version from .node-version and the pnpm version from
        # the package.json "packageManager" field.
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build Electron app
        # On a Linux host this produces the .deb configured in electron-builder.json5.
        # No code signing step: .deb packages are not signed like the Windows installer.
        env:
          in_github_action: "true"
        run: vp run build:ci

      # The Andika and ABeeZee fonts we ship live in static/, and only reach the package
      # because webpack.renderer.config.js copies static/ into dist/electron/ in production
      # builds.  Nothing else fails if that copy stops happening, and the app would still
      # look fine to anyone online or with Andika and ABeeZee installed, so assert it here.
      # (BL-16708)
      - name: Verify the Andika fonts were packaged
        shell: bash
        run: |
          for face in Regular Bold Italic BoldItalic; do
            file="dist/electron/static/fonts/Andika-$face.woff2"
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "All four Andika faces are present."
      - name: Verify the ABeeZee fonts were packaged
        shell: bash
        run: |
          for face in Regular Italic; do
            file="dist/electron/static/fonts/ABeeZee-$face.woff2"
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "Both ABeeZee faces are present."

      # The two checks above only prove webpack staged the fonts; electron-builder
      # could still leave them out of what actually ships. This one looks inside the
      # packed app's own file table. (Raised by Devin on PR #63.)
      - name: Verify the fonts reached the packaged app
        shell: bash
        run: node .github/scripts/verify-packaged-fonts.js "$(ls output/*-unpacked/resources/app.asar)"

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            output/*.deb
          name: ${{ github.ref_name }}
          body: |
            Release for version ${{ github.ref_name }}
          draft: true
