# Stop ESLint walking up past the repo. Without this it also picks up any
# .eslintrc it finds in a parent directory -- which happens whenever the repo is
# checked out inside another one (e.g. a git worktree under the main checkout) and
# fails with "couldn't determine the plugin 'react' uniquely".
root: true
env:
  browser: true
  es6: true
  node: true
extends:
  - "plugin:react/recommended"
  - "plugin:@typescript-eslint/recommended"
globals:
  Atomics: readonly
  SharedArrayBuffer: readonly
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaFeatures:
    jsx: true
  ecmaVersion: 2022
  sourceType: module
plugins:
  - react
  - "@typescript-eslint"
  - "@emotion"
rules:
  {
    "react/prop-types": 0,
    "react/no-unknown-property": ["error", { "ignore": ["css"] }],
  }
